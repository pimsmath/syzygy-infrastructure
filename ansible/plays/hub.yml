## Manages a JuptyerHub installation
---
- name: Setup generic environment
  hosts: hub
  tasks:
    # N.B. On hosts where systemd-hostnamectl is disabled
    # This task will fail. Comment it out or find a way to make
    # systemd-hostnamectl less garbage.
    # - name: Ensure hostname is set
    #   become: true
    #   tags: ["hostname"]
    #   ansible.builtin.hostname:
    #     name: "{{ inventory_hostname }}"

    # Add relevant keys to `ssh_public_keys`
    # in either host_vars, group_vars, or local_vars.
    - name: Manage SSH public keys
      tags: ["ssh"]
      ansible.posix.authorized_key:
        user: "{{ item.value.user }}"
        state: "{{ item.value.state }}"
        key: "{{ item.value.public_key }}"
      loop: "{{ ssh_public_keys | dict2items }}"
      when: ssh_public_keys is defined

    - name: Install Base Packages
      become: true
      tags: ["base-packages"]
      ansible.builtin.yum:
        name: "{{ item }}"
        state: present
      loop: "{{ base_packages }}"
      when: base_packages | length > 0

    - name: Update Process Limits
      become: true
      community.general.pam_limits:
        dest: '{{ item.dest }}'
        domain: '{{ item.domain }}'
        limit_type: '{{ item.limit_type }}'
        limit_item: '{{ item.limit_item }}'
        value: '{{ item.value }}'
      loop:
        - dest: /etc/security/limits.d/20-nproc.conf
          domain: '*'
          limit_type: soft
          limit_item: nproc
          value: '{{ pam_limit_nproc | default(131072) }}'
        - dest: /etc/security/limits.d/20-nproc.conf
          domain: 'root'
          limit_type: soft
          limit_item: nproc
          value: 'unlimited'
        - dest: /etc/security/limits.d/20-nfiles.conf
          domain: '*'
          limit_type: soft
          limit_item: nofile
          value: '{{ pam_limit_nofiles | default(32768) }}'

    - name: Install Python Environment
      become: true
      tags:
        - python
      ansible.builtin.yum:
        name: "{{ item }}"
        state: present
      loop:
        - python3.11
        - python3.11-pip
        - python3.11-devel

    - name: Set Python3.11 as the default
      become: true
      tags:
        - python
      community.general.alternatives:
        name: python3
        path: /usr/bin/python3.11
        link: /usr/bin/python3


    - name: Set pip3.11 as the default
      become: true
      tags:
        - python
      community.general.alternatives:
        name: pip3
        path: /usr/bin/pip3.11
        link: /usr/bin/pip3

    - name: Update Needs-Restarting python
      become: true
      tags:
        - python
      ansible.builtin.lineinfile:
        dest: /usr/bin/needs-restarting
        regexp: '^#!/usr/bin/python3$'
        line: '#!/usr/bin/python3.9'

    - name: Set SELinux as permissive
      become: true
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    - name: Install firewalld
      become: true
      tags:
        - firewalld
      ansible.builtin.yum:
        name: firewalld
        state: present

    - name: Poke firewall holes
      become: true
      tags:
        - firewalld
      ansible.posix.firewalld:
        service: "{{ item.value.service }}"
        permanent: "{{ item.value.permanent | default('yes') }}"
        state: "{{ item.value.state }}"
        zone: "{{ item.value.zone }}"
      loop: "{{ firewalld_service_rules | dict2items }}"
      when: firewalld_service_rules is defined

- name: Apply roles
  hosts: hub
  pre_tasks:
    - name: Install sudo
      become: yes
      ansible.builtin.package:
        name: sudo
        state: present

    - name: Configure sudoers defaults
      become: yes
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: "# Ansible managed\nDefaults !requiretty\n"
        validate: /usr/sbin/visudo -cf %s
        owner: root
        group: root
        mode: "0440"

  roles:
    - { role: geerlingguy.repo-epel, become: yes }
    - { role: devsec.hardening.ssh_hardening, become: yes }

    - role: sysstat
      become: yes

    - role: geerlingguy.apache
      become: yes
      tags:
        - httpd

    - role: dehydrated-letsencrypt
      become: yes
      tags:
        - httpd
        - ssl

    - role: apache-post
      become: yes
      tags:
        - httpd


    - role: zfs
      become: true
      tags:
        - zfs

    - role: zfs-snapshot
      become: true
      tags:
        - zfs

    - role: geerlingguy.docker
      become: yes
      tags:
        - docker
 
    - role: docker-extra
      become: yes
      tags:
        - docker

    - role: nodejs
      become: yes
      tags:
        - nodejs
        - npm

    - role: jupyterhub
      become: yes
      tags:
        - jupyter
        - jupyterhub
 
    - role: rrsync
      become: yes
      tags:
        - ssh
        - rrsync
        - backup

    - role: prometheus.prometheus.node_exporter
      become: yes
      tags:
        - prometheus
  
    - role: prometheus-target
      become: yes
      tags:
        - prometheus
