[defaults]
ansible_managed = This file is managed by Ansible. Manual changes will be overwritten.
remote_user = ptty2u
roles_path = ./roles/internal:./roles/external
collections_path = ./collections/external
private_key_file = ../keys/id_rsa
vault_password_file=~/.ansible_vault
#invalid_task_attribute_failed=False
#hash_behaviour = merge
interpreter_python: /usr/libexec/platform-python

[ssh_connection]
pipelining = True
#scp_if_ssh = True
